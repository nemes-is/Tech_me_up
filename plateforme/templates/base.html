<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tech me up{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/pygments.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand"><span class="brand-mark">›_</span> Tech me up</a>
      <nav>
        {% set path = request.url.path %}
        <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Tableau de bord</a>
        <a href="/fiches" {% if path.startswith("/fiches") %}aria-current="page"{% endif %}>Fiches</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
