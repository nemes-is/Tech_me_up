[project]
name = "tech-me-up"
version = "0.1.0"
description = "Parcours d'apprentissage de la programmation, et sa plateforme de suivi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "pygments>=2.18",
]

[project.scripts]
# `uv run plateforme` appelle la fonction run() du fichier plateforme/app.py
plateforme = "plateforme.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plateforme"]
